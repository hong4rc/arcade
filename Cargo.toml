[workspace]
resolver = "3"
members = ["crates/workload", "crates/parser-eval", "crates/term", "crates/proto", "crates/daemon", "crates/testkit", "crates/arcade", "crates/bench"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
