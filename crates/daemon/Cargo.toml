[package]
name = "arcade-daemon"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arcade-term = { path = "../term" }
arcade-proto = { path = "../proto" }
# One thread waits on the operating system's event queue (kqueue, epoll); no async runtime.
mio = { version = "1", features = ["os-poll", "net", "os-ext"] }
libc = "0.2"
toml = { version = "1", default-features = false, features = ["parse"] }

[features]
# Timestamps along the key and output paths, written to files at exit. Off by default.
stage-timing = []

[lints]
workspace = true
