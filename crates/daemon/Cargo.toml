[package]
name = "arcade-daemon"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arcade-term = { path = "../term" }
arcade-proto = { path = "../proto" }
# One thread waits on the operating system's event queue (kqueue, epoll); no async runtime.
mio = { version = "1", features = ["os-poll", "net", "os-ext"] }
libc = "0.2"

[lints]
workspace = true
