[package]
name = "arcade"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "arcade"
path = "src/main.rs"

[dependencies]
arcade-daemon = { path = "../daemon" }
arcade-proto = { path = "../proto" }
libc = "0.2"

[dev-dependencies]
arcade-testkit = { path = "../testkit" }
arcade-term = { path = "../term" }

[features]
# Timestamps along the key and output paths (see the daemon's `stage` module). Off by default.
stage-timing = ["arcade-daemon/stage-timing"]

[lints]
workspace = true
